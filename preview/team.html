<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>スタッフ紹介｜MORK STUDIO</title>
<meta name="description" content="MORK STUDIO ではこんな人が働いています。">
<meta name="robots" content="noindex"><!-- 本番では消す -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@400&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--surface:#fffdf3;--card:#fff;--ink:#262b33;--logo:#3d4f63;--muted:#5d6570;--link:#58708a;--rule:#e6e1cf}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;line-height:1.8}
a{color:var(--link)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0;border-bottom:2px solid var(--ink)}
.logo{font-family:"Dela Gothic One",sans-serif;font-size:22px;letter-spacing:.04em;color:var(--logo);text-decoration:none}
header nav a{color:var(--ink);text-decoration:none;font-weight:700;margin-left:22px}
.crumb{font-size:13px;color:var(--muted);margin:20px 0 0}
.crumb a{color:var(--muted)}
/* 見出し：会社のスタッフ紹介っぽく */
.hero{padding:40px 0 48px}
.hero .en{font-family:"Dela Gothic One",sans-serif;letter-spacing:.08em;color:var(--logo);font-size:15px}
.hero h1{font-weight:900;font-size:48px;line-height:1.3;margin:6px 0 16px}
.hero p{font-size:17px;max-width:38em;margin:0}
.facts{display:flex;flex-wrap:wrap;gap:14px;margin-top:28px}
.facts div{background:var(--card);border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:10px 16px;min-width:130px}
.facts b{display:block;font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:26px;line-height:1.2;color:var(--logo)}
.facts span{font-size:13px;color:var(--muted);font-weight:700}
.facts small{font-size:11px;color:var(--muted);display:block;line-height:1.4}
/* 部署 */
.dept{border-top:2px solid var(--ink);padding:44px 0 20px}
.dept h2{font-weight:900;font-size:26px;margin:0}
.dept .lead{color:var(--muted);font-family:"M PLUS Rounded 1c",sans-serif;margin:4px 0 24px}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.person{background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:20px;display:grid;grid-template-columns:96px 1fr;gap:4px 18px;align-content:start}
.person .av{grid-row:span 3}
.person .title{font-size:12px;font-weight:700;color:var(--muted)}
.person h3{font-size:24px;font-weight:900;line-height:1.3;margin:0}
.person h3 small{font-size:13px;font-weight:700;color:var(--muted);margin-left:4px}
.person .role{font-size:13px;color:var(--muted)}
.cands{grid-column:1/-1;margin-top:10px;background:var(--surface);border:2px dashed var(--ink);border-radius:12px;padding:8px 12px;font-size:13px}
.cands b{font-weight:900;margin-right:6px}
.cands span{display:inline-block;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 10px;margin:2px 4px 2px 0;font-weight:700}
.person dl{grid-column:1/-1;margin:12px 0 0;font-size:15px}
.person dt{font-size:12px;font-weight:900;color:var(--muted);margin-top:10px}
.person dd{margin:0}
.person .quote{font-family:"M PLUS Rounded 1c",sans-serif;font-size:16px}
.person .quote::before{content:"「"}.person .quote::after{content:"」"}
.app-tag{display:inline-block;font-size:12px;font-weight:700;color:#fff;border-radius:8px;padding:0 8px;margin-right:6px}
.owner-card{background:var(--logo);color:#fff}
.owner-card .title,.owner-card .role,.owner-card dt{color:#dfe5ec}
.notice{margin:48px 0 56px;border:3px solid var(--ink);border-radius:16px;background:#fff;padding:20px 24px;font-size:14px;color:var(--muted)}
.notice b{color:var(--ink)}
footer{border-top:2px solid var(--ink);padding:28px 0 44px;font-size:14px;color:var(--muted)}
@media (max-width:720px){
  header nav{display:none}
  .hero h1{font-size:32px}
  .hero p{font-size:16px}
  .grid{grid-template-columns:1fr}
  .person{grid-template-columns:72px 1fr;padding:16px}
  .person .av svg{width:72px;height:72px}
  .person h3{font-size:21px}
}
</style>
<script src="apps.js"></script>
<script src="staff.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top"><a class="logo" href="top.html">MORK STUDIO</a><nav><a href="top.html#apps">アプリ</a><a href="team.html">スタッフ</a><a href="https://mork-studio.hatenablog.com/">開発記</a></nav></header>
  <p class="crumb"><a href="top.html">ホーム</a> ＞ スタッフ紹介</p>

  <section class="hero">
    <div class="en">OUR STAFF</div>
    <h1>スタッフ紹介</h1>
    <p>MORK STUDIO では、こんな人たちが働いています。人間はオーナーの 1 名だけで、ほかは全員 AI です。年中無休、残業代は出ていません。</p>
    <div class="facts" id="facts"></div>
  </section>

  <div id="depts"></div>

  <p class="notice" id="notice"><b>名前は選考中です。</b> 「（仮）」の名前は、本人たちが自分で考えた名乗りの案です。点線の枠はほかの候補です。代表が選んだら、ここに決まった名前が載ります。</p>
</div>
<div class="wrap"><footer>&copy; <span id="year">2026</span> MORK STUDIO　<a href="top.html">ホームへ戻る</a></footer></div>

<script>
(function () {
  var staff = window.MORK_STAFF || [], apps = window.MORK_APPS || [];
  var appById = {}; apps.forEach(function (a) { appById[a.id] = a; });
  var DEPTS = [
    { id: "office", name: "社長室", lead: "スタジオの方針を決めて、チームをまとめます。" },
    { id: "studio", name: "制作本部", lead: "見た目と言葉で、スタジオを伝えます。" },
    { id: "write",  name: "アプリ開発部　書く係", lead: "アプリごとに 1 人ずつ。Windows でコードを書きます。" },
    { id: "ship",   name: "アプリ開発部　届ける係", lead: "アプリごとに 1 人ずつ。Mac で組み立てて、iPhone と App Store に届けます。" },
    { id: "finance", name: "財務部", lead: "夜のデータ番と、数字の裏とり。スタジオの金庫の鍵を預かっています。" }
  ];
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  var root = document.getElementById("depts");
  DEPTS.forEach(function (d) {
    var people = staff.filter(function (p) { return p.dept === d.id; });
    if (!people.length) return;
    var html = '<section class="dept"><h2>' + esc(d.name) + '</h2><p class="lead">' + esc(d.lead) + '</p><ul class="grid">';
    people.forEach(function (p) {
      var app = p.app && appById[p.app];
      var shown = esc(p.name) + (p.tentative ? '<small>（仮）</small>' : '');
      html += '<li class="person' + (p.id === "owner" ? ' owner-card' : '') + '">' +
        '<div class="av">' + window.morkAvatar(p.avatar, 96) + '</div>' +
        '<div class="title">' + esc(p.title) + '</div>' +
        '<h3>' + shown + '</h3>' +
        '<div class="role">' + (app ? '<span class="app-tag" style="background:' + esc(app.color) + '">' + esc(app.name) + '</span>' : '') + '社内での呼び名：' + esc(p.role) + '</div>' +
        (p.tentative && p.names.length ? '<div class="cands"><b>ほかの候補</b>' + p.names.map(function (n) { return '<span>' + esc(n) + '</span>'; }).join('') + '</div>' : '') +
        '<dl><dt>担当</dt><dd>' + esc(p.job) + '</dd>' +
        '<dt>口ぐせ</dt><dd class="quote">' + esc(p.quote) + '</dd>' +
        '<dt>ひとこと</dt><dd>' + esc(p.note) + '</dd></dl></li>';
    });
    root.insertAdjacentHTML("beforeend", html + '</ul></section>');
  });

  var ai = staff.filter(function (p) { return p.id !== "owner"; }).length;
  document.getElementById("facts").innerHTML =
    '<div><b>' + staff.length + ' 名</b><span>スタッフ</span></div>' +
    '<div><b>' + ai + ' 名</b><span>うち AI</span></div>' +
    '<div><b>' + apps.length + ' 本</b><span>担当アプリ</span></div>' +
    '<div><b>0 円</b><span>残業代</span><small>※ AI のため</small></div>';
  if (!staff.some(function (p) { return p.tentative; })) document.getElementById("notice").remove();
  document.getElementById("year").textContent = new Date().getFullYear();
})();
</script>
</body></html>
