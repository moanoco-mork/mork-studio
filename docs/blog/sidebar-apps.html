<!-- はてなブログ：デザイン → カスタマイズ → サイドバー → モジュールを追加 → HTML に貼る。
     ICON_URL_… と APPSTORE_URL_… を置きかえてください。見た目は hatena-design.css の .mork-app。 -->
<div class="mork-apps">
  <div class="mork-app mork-app--boomole">
    <img src="ICON_URL_BOOMOLE" alt="発破職人ブーモルのアイコン">
    <div class="mork-app-name">発破職人ブーモル</div>
    <div class="mork-app-desc">ビルをまっすぐ崩す爆破解体パズル</div>
    <a class="mork-app-btn" href="APPSTORE_URL_BOOMOLE">App Store で見る</a>
  </div>
  <div class="mork-app mork-app--tekuteku">
    <img src="ICON_URL_TEKUTEKU" alt="てくてくダイヤリーのアイコン">
    <div class="mork-app-name">てくてくダイヤリー</div>
    <div class="mork-app-desc">歩いた歩数と行った場所が、日記に残る</div>
    <a class="mork-app-btn" href="APPSTORE_URL_TEKUTEKU">App Store で見る</a>
  </div>
  <div class="mork-app mork-app--ekikan">
    <img src="ICON_URL_EKIKAN" alt="駅間アラームのアイコン">
    <div class="mork-app-name">駅間アラーム</div>
    <div class="mork-app-desc">降りる駅の手前で、イヤホンにだけ鳴る</div>
    <a class="mork-app-btn" href="APPSTORE_URL_EKIKAN">App Store で見る</a>
  </div>
</div>
