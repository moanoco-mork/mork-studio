<!doctype html>
<!-- MORK STUDIO 開発記 アイキャッチ（1200×630）
     下の DATA を書きかえてブラウザで開き、1200×630 で保存してください。
     app："boomole" / "tekuteku" / "ekikan" / "studio"（アプリと関係ない回） -->
<html lang="ja"><head><meta charset="utf-8"><title>eyecatch</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@400&family=Zen+Kaku+Gothic+New:wght@900&display=block" rel="stylesheet">
<style>
  html,body{margin:0}
  body{width:1200px;height:630px;background:#fffdf3;position:relative;overflow:hidden}
  .card{position:absolute;left:40px;top:40px;width:1104px;height:534px;background:#fff;border:6px solid #262b33;border-radius:28px;box-shadow:10px 10px 0 #262b33;overflow:hidden;display:flex;flex-direction:column}
  .brand{font-family:"Dela Gothic One",sans-serif;font-size:28px;letter-spacing:.04em;color:#3d4f63;padding:32px 48px 0}
  .brand .jp{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;letter-spacing:0}
  .title{flex:1;display:flex;align-items:center;padding:0 48px;font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;color:#262b33;line-height:1.35;font-size:60px}
  .title span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .band{position:relative;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;color:#fff;border-top:6px solid #262b33}
  .app{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;font-size:28px}
  .date{font-family:"M PLUS Rounded 1c",sans-serif;font-size:22px}
  .bell{position:absolute;right:20px;top:-20px;width:28px;height:28px;border-radius:50%;background:#a88a4f;border:4px solid #262b33}
  .boomole{background:#ffd400;color:#111111;border-top:8px solid #111111}
  .boomole .app{font-size:30px}
  .bang{position:absolute;right:20px;top:-22px;width:30px;height:30px;border-radius:50%;background:#ff3b30;border:4px solid #111111}
  .tekuteku{background:#23855c}.ekikan{background:#3f766d}.studio{background:#3d4f63}
</style></head>
<body>
<div class="card">
  <div class="brand">MORK STUDIO <span class="jp">開発記</span></div>
  <div class="title"><span id="title"></span></div>
  <div class="band" id="band"><span class="app" id="app"></span><span class="date" id="date"></span></div>
</div>
<script>
  const DATA = {
    title: "AI のチームで、iPhone アプリを3つ作った話",
    app: "ekikan",
    date: "2026.11.15"
  };
  const NAMES = { boomole: "発破職人ブーモル", tekuteku: "てくてくダイヤリー", ekikan: "駅間アラーム", studio: "MORK STUDIO" };
  const t = document.getElementById("title"), band = document.getElementById("band");
  t.textContent = DATA.title;
  document.getElementById("app").textContent = NAMES[DATA.app] || NAMES.studio;
  document.getElementById("date").textContent = DATA.date;
  band.classList.add(NAMES[DATA.app] ? DATA.app : "studio");
  const ACCENT = { ekikan: "bell", boomole: "bang" };
  if (ACCENT[DATA.app]) { const b = document.createElement("span"); b.className = ACCENT[DATA.app]; band.appendChild(b); }
  document.fonts.ready.then(() => {
    const title = document.querySelector(".title");
    for (const size of [60, 52, 44]) {
      title.style.fontSize = size + "px";
      if (t.scrollHeight <= t.clientHeight + 1) break;
    }
  });
</script>
</body></html>
