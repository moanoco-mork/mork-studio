<!doctype html>
<!-- MORK STUDIO ブログアイコン（512×512）。1024 が必要なら deviceScaleFactor 2 で保存する。 -->
<html lang="ja"><head><meta charset="utf-8"><title>icon</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=block" rel="stylesheet">
<style>
  html,body{margin:0;background:transparent}
  .icon{width:512px;height:512px;border-radius:128px;background:#3d4f63;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Dela Gothic One",sans-serif;color:#ffffff}
  .m{font-size:300px;line-height:.9;margin-top:-10px}
  .s{font-size:64px;letter-spacing:.04em;line-height:1;margin-top:22px}
</style></head>
<body><div class="icon"><div class="m">M</div><div class="s">STUDIO</div></div></body></html>
